name: Extract Project

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          if [ -f settings.gradle ]; then
            echo "Project already extracted. Nothing to do."
            exit 0
          fi

          test -f AI_Physics_Helper_FINAL_RELEASE.zip

          rm -rf extracted
          mkdir extracted

          unzip -q AI_Physics_Helper_FINAL_RELEASE.zip -d extracted

          test -d extracted/aproj

          cp -a extracted/aproj/. .

          rm -rf extracted

          # Keep GitHub workflow files unchanged
          git restore .github

      - name: Commit extracted project
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git restore --staged .github
          git add .github

          git commit -m "Extract AI Physics Helper project"
          git push
